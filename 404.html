<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a08">
  <meta name="robots" content="noindex">
  <title>Not found - International Duck</title>
  <style>
    :root{color-scheme:dark;--green:#8cf77a;--muted:#929a94;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{display:grid;min-height:100svh;margin:0;padding:1.25rem;place-items:center;overflow:hidden;color:#f4f7f4;background:#070a08;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before,body:after{position:fixed;z-index:-1;width:34rem;height:34rem;border-radius:50%;filter:blur(90px);content:""}body:before{top:-18rem;right:-12rem;background:rgba(83,208,87,.14)}body:after{bottom:-24rem;left:-15rem;background:rgba(67,118,83,.1)}.card{position:relative;width:min(100%,36rem);padding:clamp(2rem,7vw,4rem);overflow:hidden;border:1px solid var(--line);border-radius:1.4rem;background:linear-gradient(145deg,rgba(25,31,27,.82),rgba(11,14,12,.7));box-shadow:0 30px 90px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.06);text-align:center;backdrop-filter:blur(24px)}.card:before{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(140,247,122,.08),transparent 42%);pointer-events:none;content:""}.logo{position:relative;width:4.5rem;height:4.5rem;margin:0 auto 2rem;object-fit:cover;border:1px solid rgba(255,255,255,.12);border-radius:1rem;box-shadow:0 14px 28px rgba(0,0,0,.35)}.code{position:relative;color:var(--green);font:700 .68rem "SFMono-Regular",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}h1{position:relative;margin:.9rem 0 .65rem;font-size:clamp(2.45rem,9vw,4.7rem);line-height:.95;letter-spacing:-.065em}p{position:relative;margin:0;color:var(--muted);line-height:1.65}a{position:relative;display:inline-flex;margin-top:2rem;padding:.85rem 1.15rem;align-items:center;gap:.55rem;color:#081007;background:var(--green);border-radius:.65rem;box-shadow:0 10px 30px rgba(91,214,82,.16);font-size:.77rem;font-weight:800;text-decoration:none;transition:.2s ease}a:hover{background:#a5fb96;transform:translateY(-2px)}a:focus-visible{outline:2px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/org-avatar.png" alt="International Duck Incorporated" decoding="async">
    <span class="code">Error / 404</span>
    <h1>Lost in space.</h1>
    <p>The route you followed doesn’t exist or may have moved.</p>
    <a href="/">Return home <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>

# The canonical site is served by Cloudflare Pages (https://idi-official.pages.dev).
# GitHub Pages now serves a full mirror of the static site (since GitHub is unbanned).
#
# This workflow copies the static site to public/ and deploys it to GitHub Pages.
# Excludes Cloudflare-specific files (_headers, _redirects, functions/, wrangler.jsonc).

name: Deploy GitHub Pages mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public folder
        run: |
          mkdir -p public
          # Copy all static site files
          cp -r *.html public/ 2>/dev/null || true
          cp -r css public/ 2>/dev/null || true
          cp -r assets public/ 2>/dev/null || true
          cp -r js public/ 2>/dev/null || true
          cp -r data public/ 2>/dev/null || true
          cp -r members public/ 2>/dev/null || true
          cp -r projects public/ 2>/dev/null || true
          cp -r baritone public/ 2>/dev/null || true
          cp _redirects public/ 2>/dev/null || true
          cp 403.html public/ 2>/dev/null || true
          cp 404.html public/ 2>/dev/null || true
          cp robots.txt public/ 2>/dev/null || true
          cp sitemap.xml public/ 2>/dev/null || true
          cp .nojekyll public/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
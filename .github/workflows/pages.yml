# The canonical site is served by Cloudflare Pages (https://idi-official.pages.dev).
# GitHub Pages only serves a catch-all 301 so old github.io links keep working.
#
# This workflow deploys a _redirects file to GitHub Pages with a wildcard rule
# that redirects all paths to the corresponding path on idi-official.pages.dev.

name: Deploy GitHub Pages redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect file
        run: |
          mkdir -p public
          printf '/* https://idi-official.pages.dev/:splat 301\n' > public/_redirects

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
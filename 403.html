<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <meta name="robots" content="noindex" />
    <title>Blocked - International Duck</title>
    <style>
      :root {
        color-scheme: dark;
        --red: #ff8f8f;
        --blue: #5a9bf2;
        --muted: #929b96;
        --line: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 1.25rem;
        place-items: center;
        overflow: hidden;
        color: #f4f7f5;
        background: #07090d;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body:before,
      body:after {
        position: fixed;
        z-index: -1;
        width: 34rem;
        height: 34rem;
        border-radius: 50%;
        filter: blur(90px);
        content: "";
      }
      body:before {
        top: -18rem;
        right: -12rem;
        background: rgba(255, 120, 120, 0.12);
      }
      body:after {
        bottom: -24rem;
        left: -15rem;
        background: rgba(150, 80, 90, 0.09);
      }
      .card {
        position: relative;
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 3.8rem);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1.4rem;
        background: linear-gradient(145deg, rgba(31, 25, 27, 0.82), rgba(14, 11, 13, 0.7));
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.42),
          inset 0 1px rgba(255, 255, 255, 0.06);
        text-align: center;
        backdrop-filter: blur(24px);
      }
      .card:before {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0, rgba(255, 143, 143, 0.08), transparent 42%);
        pointer-events: none;
        content: "";
      }
      .mark {
        position: relative;
        display: grid;
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 2rem;
        place-items: center;
        color: var(--red);
        background: linear-gradient(145deg, rgba(255, 143, 143, 0.13), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(255, 143, 143, 0.3);
        border-radius: 1rem;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
      }
      .mark svg {
        width: 2.05rem;
        height: 2.05rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .code {
        position: relative;
        color: var(--red);
        font:
          700 0.68rem "SFMono-Regular",
          Consolas,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        position: relative;
        margin: 0.9rem 0 0.65rem;
        font-size: clamp(2.3rem, 8vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }
      p {
        position: relative;
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      p a {
        color: #e9efeb;
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.28);
        text-underline-offset: 3px;
      }
      p a:hover {
        color: #fff;
      }
      .ip {
        display: inline-flex;
        margin: 1.15rem 0 0;
        padding: 0.5rem 0.85rem;
        gap: 0.45rem;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        color: #a9b1ab;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid var(--line);
        border-radius: 999px;
        font:
          500 0.64rem "SFMono-Regular",
          Consolas,
          monospace;
      }
      .ip b {
        color: #ffb4b4;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      a.btn {
        position: relative;
        display: inline-flex;
        margin-top: 2rem;
        padding: 0.85rem 1.15rem;
        gap: 0.55rem;
        align-items: center;
        color: #fff;
        background: var(--blue);
        border-radius: 0.65rem;
        box-shadow: 0 10px 30px rgba(90, 155, 242, 0.16);
        font-size: 0.77rem;
        font-weight: 800;
        text-decoration: none;
        transition: 0.2s ease;
      }
      a.btn:hover {
        background: #70aaf5;
        transform: translateY(-2px);
      }
      a.btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }
      a.btn svg {
        width: 0.95rem;
        height: 0.95rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true"
        ><svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.6" />
          <path d="M5.9 5.9l12.2 12.2" /></svg
      ></span>
      <span class="code">Error / 403</span>
      <h1>Uh oh, you’re blocked.</h1>
      <p>
        Your IP address is on the site’s blocklist, so the site won’t load from this connection. If
        this is a mistake, email <a href="{{MAILTO}}">0xffshell@duck.com</a> and we’ll take a look.
      </p>
      {{IP_CHIP}}<a class="btn" href="{{MAILTO}}"
        ><svg viewBox="0 0 24 24">
          <path d="M3.5 5.5h17v13h-17z" />
          <path d="m3.5 6.5 8.5 6.5 8.5-6.5" /></svg
        >Email the team</a
      >
    </main>
  </body>
</html>
